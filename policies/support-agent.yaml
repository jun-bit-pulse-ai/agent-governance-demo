apiVersion: governance.toolkit/v1
version: "1.0"
name: support-agent-nova
description: >
  Nova, the customer-support agent. Inherits every rule in the ACME
  baseline and adds the permissions this team actually needs.
extends: ["baseline.yaml"]
scope: agent
agents: ["did:mesh:support-nova"]
default_action: deny        # fail closed: anything not granted is refused

rules:
  - name: allow-read-queries
    condition: "sql.verb == 'SELECT'"
    action: allow
    description: "Read-only queries are Nova's normal work"

  # Note the lower bound. `recipients.value < 50` alone is satisfied by a
  # missing, null or negative value, because the engine coerces None to 0
  # (policy.py:164) — so an omitted field would sail past the approval gate.
  # An allow rule must assert what it needs, never merely fail to object.
  - name: allow-routine-email
    condition: "action.type == 'send_email' and recipients.value >= 1 and recipients.value < 50"
    action: allow
    description: "Replying to a customer needs no ceremony"

  - name: approve-bulk-email
    condition: "action.type == 'send_email' and recipients.value >= 50"
    action: require_approval
    approvers: ["security-team"]
    priority: 50
    description: "Anything campaign-shaped gets a human in the loop"

  # Requires a positive `anonymised` assertion rather than the mere absence of
  # `contains_pii`: an empty data dict, or a misspelt key, would otherwise
  # allow a 12,000-row personal-data export. Absence must fall through to the
  # deny default, not into an allow.
  - name: allow-anonymised-export
    condition: "action.type == 'export_dataset' and data.anonymised and rows.value >= 1 and rows.value <= 50000"
    action: allow
    description: "Bounded exports are fine once positively marked anonymised"
